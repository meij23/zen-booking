<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mei 禪卡解讀｜預約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#f6f3eb;--card:#fffdf8;--ink:#26352d;--mute:#758078;--line:#e3dfd3;--brand:#5c7662;--soft:#e7ece4;--gold:#96743f;--ok:#2e7d4f;--warn:#a86a00;--crit:#a9503f;
--display:"Zen Old Mincho","Noto Serif TC","Songti TC",serif;--body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:.08em;margin:0}
h1{font-size:19px;letter-spacing:.16em} h2{font-size:24px;line-height:1.6} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.top{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 60px;display:flex;flex-direction:column;gap:14px}
.wrap.wide{max-width:900px}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 40px #26352d0a}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.mute{color:var(--mute);font-size:13px}
.price{color:var(--gold);font-weight:700}
.orig{text-decoration:line-through;color:var(--mute);font-size:13px;font-weight:400}
.tag{background:var(--soft);color:#4d6053;border-radius:20px;padding:1px 9px;font-size:12.5px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fffdf8;border-radius:3px;padding:9px 16px;cursor:pointer;letter-spacing:.06em}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45}
.art{height:150px;position:relative;overflow:hidden;border-radius:90px 90px 3px 3px;background:linear-gradient(160deg,#dce4d8,#ebe5d8 60%,#d9d0bd)}
.art i{position:absolute;display:block}
.sun{width:84px;height:84px;border-radius:50%;background:#d8bb89;opacity:.78;left:calc(50% - 42px);top:22px}
.hA,.hB{left:-5%;width:110%;bottom:0}
.hA{height:64%;background:#617567;opacity:.3;clip-path:polygon(0 70%,25% 25%,45% 60%,65% 15%,100% 65%,100% 100%,0 100%)}
.hB{height:48%;background:#728675;clip-path:polygon(0 75%,20% 40%,38% 65%,58% 10%,80% 60%,100% 35%,100% 100%,0 100%)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{flex:0 0 auto;min-width:60px;border:1px solid var(--line);background:var(--card);border-radius:3px;padding:6px 4px;text-align:center;cursor:pointer}
.day small{display:block;color:var(--mute)}
.day.on{background:var(--ink);color:#fffdf8;border-color:var(--ink)} .day.on small{color:inherit}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:9px 0;cursor:pointer}
.slot.on{background:var(--brand);color:#fffdf8;border-color:var(--brand)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
label.chk{flex-direction:row;align-items:flex-start;gap:8px;color:var(--ink)}
input[type=text],input[type=number],input[type=date],select,textarea{background:#fffefa;border:1px solid var(--line);border-radius:3px;padding:8px 10px;color:var(--ink);min-width:0;max-width:100%;width:100%}
textarea{min-height:70px;resize:vertical}
.bubble{background:var(--soft);border-left:4px solid #06c755;padding:12px 14px;white-space:pre-line;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:3px;padding:6px 14px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fffdf8;border-color:var(--ink)}
.item{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.item:first-of-type{border-top:0;padding-top:0}
.pill{border:1px solid currentColor;border-radius:20px;padding:0 9px;font-size:12.5px}
.s-已確認{color:var(--brand)}.s-已完成{color:var(--ok)}.s-已取消{color:var(--mute)}.s-未出席{color:var(--crit)}.s-開放{color:var(--ok)}.s-已約{color:var(--brand)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.foot{text-align:center;margin-top:10px}
.foot button{border:0;background:none;color:var(--mute);font-size:12px;text-decoration:underline;cursor:pointer}
#busy{position:fixed;inset:0;background:#f6f3ebcc;display:flex;align-items:center;justify-content:center;z-index:8;font-family:var(--display);letter-spacing:.2em}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fffdf8;padding:9px 18px;border-radius:3px;font-size:14px;z-index:9;max-width:90%}
[hidden]{display:none!important}
.rec{border-left:3px solid var(--brand);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:4px}
.private{background:var(--bg);border-radius:3px;padding:6px 10px;font-size:13px}
.pre{white-space:pre-wrap}
.lk{border:0;background:none;color:var(--brand);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:12.5px}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="top"><h1 id="brand"></h1><span class="mute" id="hello"></span></div>
<div id="app"><div class="wrap"><div class="art"><i class="sun"></i><i class="hA"></i><i class="hB"></i></div><h2>慢慢來，<br>先聽聽自己怎麼說。</h2><div class="mute">正在載入服務與時段…</div></div></div>
<div id="busy" hidden>處理中</div>
<div id="toast" hidden></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// 這三個值不是金鑰，可以公開
var LIFF_ID = '2012656478-rqcbKIlt';
var BACKEND_URL = 'https://zen-booking.s99111154.workers.dev/';
var BRAND = 'Mei 禪卡解讀';
var OA_ADD_URL = 'https://line.me/R/ti/p/%40411uatai';
var OA_MSG_URL = 'https://line.me/R/oaMessage/%40411uatai/?';

var WD = ['日','一','二','三','四','五','六'];
var D = null, A = null;
var TOPICS = ['財務','工作','感情','家庭','自我探索','其他'];
var ui = { cq:'', custs:null, cust:null, editRec:null, prefill:null, view:'c', step:1, svc:null, date:null, slot:null, done:null, tab:'book', showId:false, stale:false };
var READY = null;
var CACHE_KEY = 'zen_pub_v1';
var T0 = Date.now(), TIMES = null;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function nice(d){ var x=new Date(d+'T12:00:00+08:00'); return (x.getMonth()+1)+'/'+x.getDate()+'（'+WD[x.getDay()]+'）'; }
function ts(o){ return new Date(o.date+'T'+o.time+':00+08:00').getTime(); }
function money(n){ return 'NT$ '+Number(n).toLocaleString(); }
function toast(t){ var el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){el.hidden=true;},3500); }

function tokenExp(t){
  try{ return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000; }catch(e){ return 0; }
}
function relogin(){
  try{ sessionStorage.setItem('zen_relog', String(Date.now())); }catch(e){}
  try{ if(liff.isLoggedIn()) liff.logout(); }catch(e){}
  liff.login({ redirectUri: location.href.split('#')[0] });
}
function recentlyRelogged(){
  try{ return Date.now() - Number(sessionStorage.getItem('zen_relog')||0) < 60000; }catch(e){ return false; }
}
async function api(action, payload){
  await READY;
  var tok = liff.getIDToken();
  if(!tok || tokenExp(tok) < Date.now() + 60000){
    if(!recentlyRelogged()){ relogin(); throw new Error('登入逾時，正在重新登入'); }
  }
  var body = Object.assign({ action:action, idToken:tok }, payload||{});
  var res = await fetch(BACKEND_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body) });
  var j = await res.json();
  if(!j.ok) throw new Error(j.error);
  return j.data;
}
async function run(fn){
  $('busy').hidden=false;
  try{ await fn(); }catch(e){ toast(e && e.message ? e.message : '發生錯誤，請再試一次'); }
  $('busy').hidden=true;
  render();
}
async function checkFriend(){
  try{ var f = await liff.getFriendship(); return !!f.friendFlag; }catch(e){ return null; } // 查不到就不擋
}
async function loadC(){
  var r = await Promise.all([ api('init'), checkFriend() ]);
  D = r[0]; D.isFriend = r[1]; ui.stale = false;
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ services:D.services, slots:D.slots, notice:D.notice, cancelHours:D.cancelHours })); }catch(e){}
}
async function loadA(){ A = await api('adminInit'); }

/* ---------- 客人端 ---------- */
function svcOf(id){ return D.services.filter(function(s){return s.id===id;})[0]; }
function priceHtml(s){ return '<span class="price">'+money(s.price)+'</span>'+(s.orig&&s.orig!==s.price?' <span class="orig">原價 '+Number(s.orig).toLocaleString()+'</span>':''); }

function vCustomer(){
  var h='';
  if(ui.step>=2 && ui.step<=3 && !svcOf(ui.svc)){ ui.step=1; ui.svc=null; }
  if(ui.step===3 && !D.slots.some(function(x){return x.id===ui.slot;})){ ui.step=2; ui.slot=null; }
  if(ui.step===1){
    h+='<div class="art"><i class="sun"></i><i class="hA"></i><i class="hB"></i></div><h2>慢慢來，<br>先聽聽自己怎麼說。</h2>';
    if(D.notice) h+='<div class="mute">'+esc(D.notice)+'</div>';
    if(D.mine.length){
      h+='<div class="card"><h3>我的預約</h3>'+D.mine.map(function(b){
        var can = ts(b)-Date.now() >= D.cancelHours*3600000;
        return '<div class="item"><div>'+nice(b.date)+' '+b.time+'　'+esc(b.service)+'</div><div class="row between"><span class="mute">'+money(b.price)+'，服務後付款</span>'+
          (can?'<button class="btn sm danger" data-act="cancel" data-id="'+b.id+'">取消預約</button>':'<span class="mute">'+D.cancelHours+' 小時內要調整請傳訊息給我</span>')+'</div></div>';
      }).join('')+'</div>';
    }
    h+=D.services.map(function(s){
      return '<div class="card"><div class="row between"><h3>'+esc(s.name)+'</h3><span>'+priceHtml(s)+'</span></div><div>'+esc(s.intro)+'</div>'+
        '<div class="row"><span class="tag">保留約 '+esc(s.minutes)+' 分鐘</span><span class="tag">'+esc(s.mode)+'</span>'+(s.left?'<span class="tag">練習價第 '+s.stage+' 階，剩 '+s.left+' 位</span>':'')+'</div>'+
        (s.note?'<div class="mute">注意事項：'+esc(s.note)+'</div>':'')+
        '<div><button class="btn" data-act="pick" data-id="'+s.id+'">預約這個服務</button></div></div>';
    }).join('');
    if(!D.services.length) h+='<div class="card mute">目前沒有開放的服務。</div>';
    // 只有管理者本人看得到；還沒設定管理者時才會暫時顯示，方便取得識別碼
    if(!ui.stale && (D.isAdmin || D.adminUnset)) h+='<div class="foot"><button data-act="admin">管理入口</button></div>';
    if(D.isAdmin && TIMES) h+='<div class="foot mute">載入時間：LINE 登入 '+TIMES.line+' 秒・後端資料 '+TIMES.data+' 秒</div>';
    if(ui.showId) h+='<div class="card"><div class="mute">請把下面這串識別碼，貼到 Apps Script 的指令碼屬性 ADMIN_USER_ID：</div><div style="word-break:break-all">'+esc(D.userId)+'</div></div>';
  }
  if(ui.step===2){
    var s=svcOf(ui.svc), dates=[];
    D.slots.forEach(function(x){ if(dates.indexOf(x.date)<0) dates.push(x.date); });
    if(!ui.date||dates.indexOf(ui.date)<0) ui.date=dates[0]||null;
    h+='<div class="card"><div class="row between"><h3>'+esc(s.name)+'</h3><span>'+priceHtml(s)+'</span></div>';
    if(!dates.length){
      h+='<div class="mute">目前沒有開放的時段。歡迎直接傳訊息給我，告訴我你方便的時間。</div>';
    }else{
      h+='<div class="days">'+dates.map(function(d){ var x=new Date(d+'T12:00:00+08:00'); return '<button class="day '+(d===ui.date?'on':'')+'" data-act="date" data-d="'+d+'"><small>週'+WD[x.getDay()]+'</small>'+(x.getMonth()+1)+'/'+x.getDate()+'</button>'; }).join('')+'</div>'+
        '<div class="slots">'+D.slots.filter(function(x){return x.date===ui.date;}).map(function(x){ return '<button class="slot '+(x.id===ui.slot?'on':'')+'" data-act="slot" data-id="'+x.id+'">'+x.time+'</button>'; }).join('')+'</div>'+
        '<div class="mute">保留時間是上限，談完就結束，不一定會用滿。</div>';
    }
    h+='<div class="row between"><button class="btn ghost" data-act="home">上一步</button><button class="btn" data-act="toform" '+(ui.slot?'':'disabled')+'>下一步</button></div></div>';
  }
  if(ui.step===3){
    var s3=svcOf(ui.svc), sl=D.slots.filter(function(x){return x.id===ui.slot;})[0];
    h+='<div class="card"><h3>確認預約資料</h3><div>'+esc(s3.name)+'　'+nice(sl.date)+' '+sl.time+'　'+priceHtml(s3)+'</div>'+
      '<div class="mute">服務結束後才付款，可用現金、轉帳或 LINE Pay。</div>'+
      '<label>怎麼稱呼你<input type="text" id="f-name" maxlength="30" value="'+esc(D.name)+'"></label>'+
      '<label>聯絡方式（選填）<input type="text" id="f-contact" maxlength="60" placeholder="手機或 Email"></label>'+
      '<label>這次想探索的主題或困惑（選填）<textarea id="f-topic" maxlength="500"></textarea></label>'+
      (D.isFriend===false ? '<div class="card" style="border-color:var(--warn)"><b>請先加入官方帳號好友</b><div>加入好友後，才收得到預約成功通知和前一天的提醒。</div>'+
        '<div class="row"><button class="btn" data-act="addFriend">加入好友</button><button class="btn ghost" data-act="recheck">我加好了</button></div></div>' : '')+
      '<label class="chk"><input type="checkbox" id="f-agree"><span>我了解預約資料只用於安排這次服務與提醒，不會提供給其他人；想刪除資料可以隨時告訴我。</span></label>'+
      '<div class="row between"><button class="btn ghost" data-act="back2">上一步</button><button class="btn" data-act="book" '+(D.isFriend===false?'disabled':'')+'>送出預約</button></div></div>';
  }
  if(ui.step===4&&ui.done){
    h+='<div class="card"><h3>預約完成</h3>'+
      '<div class="card" style="border-color:var(--brand);box-shadow:none"><b>最後一步：把預約資料傳給我</b>'+
      '<div>按下按鈕會打開和我的聊天室，訊息已經幫你填好，按「傳送」就完成。也請順便加入好友，才收得到前一天的提醒。</div>'+
      '<div><button class="btn" data-act="sendBack">回傳預約資料</button></div></div>'+
      '<div class="mute">你的預約內容：</div><div class="bubble">'+esc(ui.done.message)+'</div>'+
      '<div><button class="btn ghost" data-act="home">回到首頁</button></div></div>';
  }
  return '<div class="wrap">'+h+'</div>';
}

/* ---------- 管理端 ---------- */
function bookingItem(b){
  var paidVal = b.paid==='已收款' ? (b.method||'現金') : '未收款';
  return '<div class="item"><div class="row between"><b>'+nice(b.date)+' '+b.time+'　'+(b.cust?'<button class="lk" data-act="openCust" data-id="'+b.cust+'" data-bid="'+b.id+'">'+esc(b.name)+'</button>':esc(b.name))+'</b><span class="pill s-'+b.status+'">'+b.status+'</span></div>'+
    '<div>'+esc(b.service)+'　'+money(b.price)+'</div>'+(b.topic?'<div class="mute">主題：'+esc(b.topic)+'</div>':'')+
    '<div class="form"><label>狀態<select data-chg="status" data-id="'+b.id+'">'+['已確認','已完成','已取消','未出席'].map(function(x){return '<option '+(x===b.status?'selected':'')+'>'+x+'</option>';}).join('')+'</select></label>'+
    '<label>收款<select data-chg="paid" data-id="'+b.id+'">'+['未收款','現金','轉帳','LINE Pay'].map(function(x){return '<option '+(x===paidVal?'selected':'')+'>'+x+'</option>';}).join('')+'</select></label></div></div>';
}
function svcForm(s){
  var id=s.id||'new';
  return '<div class="card"><h3>'+(s.id?esc(s.name):'新增服務')+'</h3>'+
    '<label>名稱<input type="text" id="sv-'+id+'-name" value="'+esc(s.name||'')+'"></label>'+
    '<label>介紹<textarea id="sv-'+id+'-intro">'+esc(s.intro||'')+'</textarea></label>'+
    '<div class="form"><label>原價<input type="number" id="sv-'+id+'-price" min="0" step="100" value="'+esc(s.price||1200)+'"></label>'+
    '<label>保留分鐘<input type="number" id="sv-'+id+'-minutes" min="5" step="5" value="'+esc(s.minutes||30)+'"></label>'+
    '<label>方式<select id="sv-'+id+'-mode">'+['線上／面對面','線上','面對面'].map(function(x){return '<option '+(x===s.mode?'selected':'')+'>'+x+'</option>';}).join('')+'</select></label></div>'+
    '<label>注意事項<input type="text" id="sv-'+id+'-note" value="'+esc(s.note||'')+'"></label>'+
    '<label class="chk"><input type="checkbox" id="sv-'+id+'-active" '+(s.id&&!s.active?'':'checked')+'>開放預約</label>'+
    '<label class="chk"><input type="checkbox" id="sv-'+id+'-tiered" '+(s.tiered?'checked':'')+'>使用練習期階梯價</label>'+
    '<div><button class="btn" data-act="saveSvc" data-id="'+id+'">儲存</button></div></div>';
}
function vAdmin(){
  var tabs=[['book','預約'],['cust','客戶'],['slot','時段'],['svc','服務'],['set','設定']];
  var h='<div class="row between"><div class="tabs">'+tabs.map(function(t){return '<button class="'+(ui.tab===t[0]?'on':'')+'" data-act="tab" data-t="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div><button class="btn sm ghost" data-act="cview">回客人頁</button></div>';
  var now=Date.now();
  if(ui.tab==='book'){
    var up=A.bookings.filter(function(b){return b.status==='已確認'&&ts(b)>now-3600000;}).reverse();
    var unpaid=A.bookings.filter(function(b){return b.status==='已完成'&&b.paid!=='已收款';});
    var rest=A.bookings.filter(function(b){return up.indexOf(b)<0&&unpaid.indexOf(b)<0;});
    h+='<div class="card"><h3>接下來的預約（'+up.length+'）</h3>'+(up.map(bookingItem).join('')||'<div class="mute">目前沒有預約。</div>')+'</div>';
    if(unpaid.length) h+='<div class="card"><h3>已完成、還沒收款（'+unpaid.length+'）</h3>'+unpaid.map(bookingItem).join('')+'</div>';
    if(rest.length) h+='<div class="card"><h3>其他紀錄</h3>'+rest.map(bookingItem).join('')+'</div>';
  }
  if(ui.tab==='slot'){
    var fut=A.slots.filter(function(s){return ts(s)>now;});
    h+='<div class="card"><h3>放出新時段</h3><div class="form"><label>日期<input type="date" id="sl-date"></label>'+
      '<label>時間（可以一次填多個，用逗號分開）<input type="text" id="sl-times" placeholder="14:00, 16:00, 20:00"></label></div>'+
      '<div><button class="btn" data-act="addSlots">加入時段</button></div><div class="mute">每個時段是一個名額，間隔請自己抓。客人只看得到 6 小時之後的開放時段。</div></div>'+
      '<div class="card"><h3>未來的時段（'+fut.length+'）</h3>'+(fut.map(function(s){
        return '<div class="row between"><span>'+nice(s.date)+' '+s.time+'　<span class="pill s-'+s.status+'">'+s.status+'</span></span>'+(s.status==='開放'?'<button class="btn sm ghost" data-act="delSlot" data-id="'+s.id+'">移除</button>':'')+'</div>';
      }).join('')||'<div class="mute">還沒有放任何時段。</div>')+'</div>';
  }
  if(ui.tab==='svc'){
    h+=A.services.map(svcForm).join('')+svcForm({});
    h+='<div class="card"><h3>練習期階梯價</h3>'+A.tiers.map(function(t,i){return '<div>第 '+(i+1)+' 階：到第 '+esc(t.upto)+' 位為止，'+money(t.price)+'</div>';}).join('')+'<div class="mute">超過最後一階就恢復原價。級距的修改畫面在第 2 期加入。</div></div>';
  }
  if(ui.tab==='cust'){ h+= ui.cust ? vCustDetail() : vCustList(); }
  if(ui.tab==='set'){
    h+='<div class="card"><h3>設定</h3><div class="mute">有新預約或取消時，LINE 會直接通知你。</div>'+
      '<label>預約頁上方的說明文字<textarea id="st-notice">'+esc(A.settings['預約頁說明'])+'</textarea></label>'+
      '<label>客人自己取消的期限（開始前幾小時）<input type="number" id="st-cancel" min="0" max="72" value="'+esc(A.settings['取消期限小時'])+'"></label>'+
      '<label>收款說明（第 2 期會在服務後自動傳給客人）<textarea id="st-pay">'+esc(A.settings['收款說明'])+'</textarea></label>'+
      '<div><button class="btn" data-act="saveSet">儲存設定</button></div></div>';
  }
  return '<div class="wrap wide">'+h+'</div>';
}

/* ---------- 客戶與探索紀錄 ---------- */
function vCustList(){
  var h='<div class="card"><h3>客戶</h3><div class="row"><input type="text" id="c-q" value="'+esc(ui.cq)+'" placeholder="搜尋姓名、主題、牌名或任何關鍵字" style="flex:1"><button class="btn" data-act="custSearch">搜尋</button></div>';
  if(!ui.custs) h+='<div class="mute">載入中…</div>';
  else if(!ui.custs.length) h+='<div class="mute">'+(ui.cq?'找不到符合的客人。':'還沒有客人。')+'</div>';
  else h+='<div class="scroll"><table><tr><th>姓名</th><th>來過</th><th>紀錄</th><th>最近預約</th></tr>'+ui.custs.map(function(c){
    return '<tr><td><button class="lk" data-act="openCust" data-id="'+c.id+'">'+esc(c.name)+'</button></td><td>'+c.visits+' 次</td><td>'+c.recs+' 筆</td><td>'+(c.last?nice(c.last):'—')+'</td></tr>';
  }).join('')+'</table></div>';
  h+='</div><div class="card"><h3>手動新增客人</h3><div class="mute">給沒有透過 LINE 預約的客人用，例如朋友直接約的。</div><div class="form"><label>姓名<input type="text" id="nc-name" maxlength="30"></label><label>聯絡方式（選填）<input type="text" id="nc-contact" maxlength="60"></label></div><div><button class="btn ghost" data-act="newCust">新增</button></div></div>';
  return h;
}
function recForm(){
  var r=ui.editRec||ui.prefill||{}, editing=!!(ui.editRec&&ui.editRec.id);
  var svcNames=(A.services||[]).map(function(x){return x.name;});
  if(r.service && svcNames.indexOf(r.service)<0) svcNames.push(r.service);
  var today=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
  return '<div class="card"><h3>'+(editing?'編輯探索紀錄':'新增探索紀錄')+'</h3>'+
    '<div class="form"><label>日期<input type="date" id="r-date" value="'+esc(r.date||today)+'"></label>'+
    '<label>服務<select id="r-service">'+svcNames.map(function(n){return '<option '+(n===r.service?'selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select></label>'+
    '<label>主題<select id="r-topic">'+TOPICS.map(function(t){return '<option '+(t===r.topic?'selected':'')+'>'+t+'</option>';}).join('')+'</select></label></div>'+
    '<label>客人提出的問題<textarea id="r-question" maxlength="1000">'+esc(r.question||'')+'</textarea></label>'+
    '<label>抽到的牌<input type="text" id="r-cards" maxlength="300" value="'+esc(r.cards||'')+'" placeholder="例如：勇氣、轉變、豐盛"></label>'+
    '<label>禪卡解讀紀錄<textarea id="r-reading" maxlength="4000" style="min-height:120px">'+esc(r.reading||'')+'</textarea></label>'+
    '<label>我的私人備註（只有你看得到）<textarea id="r-memo" maxlength="2000">'+esc(r.memo||'')+'</textarea></label>'+
    '<div class="row"><button class="btn" data-act="saveRec">儲存紀錄</button>'+((editing||ui.prefill)?'<button class="btn ghost" data-act="cancelRec">取消</button>':'')+'</div></div>';
}
function vCustDetail(){
  var c=ui.cust.customer, bs=ui.cust.bookings, rs=ui.cust.records;
  var h='<div><button class="btn sm ghost" data-act="custBack">回客戶列表</button></div>';
  h+='<div class="card"><div class="row between"><h2 style="font-size:20px">'+esc(c.name)+'</h2>'+(c.viaLine?'<span class="tag">LINE 預約</span>':'<span class="tag">手動建立</span>')+'</div>'+
    '<div class="row"><span class="tag">首次 '+(c.first?nice(c.first):'—')+'</span><span class="tag">來過 '+bs.filter(function(b){return b.status==='已確認'||b.status==='已完成';}).length+' 次</span>'+(c.noShow>0?'<span class="tag" style="color:var(--crit)">未出席 '+c.noShow+' 次</span>':'')+'</div>'+
    '<div class="form"><label>姓名<input type="text" id="cu-name" maxlength="30" value="'+esc(c.name)+'"></label><label>聯絡方式<input type="text" id="cu-contact" maxlength="60" value="'+esc(c.contact||'')+'"></label></div>'+
    '<div class="row"><button class="btn sm ghost" data-act="saveCust">儲存資料</button><button class="btn sm danger" data-act="delCust">刪除這位客人的資料</button></div></div>';
  h+=recForm();
  h+='<div class="card"><h3>探索歷程（'+rs.length+'）</h3>'+(rs.length?rs.map(function(r){
    return '<div class="rec"><div class="row between"><b>'+nice(r.date)+'　'+esc(r.service)+'</b><span class="tag">'+esc(r.topic)+'</span></div>'+
      (r.question?'<div><span class="mute">問題：</span><span class="pre">'+esc(r.question)+'</span></div>':'')+
      (r.cards?'<div><span class="mute">抽到的牌：</span>'+esc(r.cards)+'</div>':'')+
      (r.reading?'<div class="pre">'+esc(r.reading)+'</div>':'')+
      (r.memo?'<div class="private pre">私人備註：'+esc(r.memo)+'</div>':'')+
      '<div class="row"><button class="btn sm ghost" data-act="editRec" data-id="'+r.id+'">編輯</button><button class="btn sm ghost" data-act="delRec" data-id="'+r.id+'">刪除</button></div></div>';
  }).join(''):'<div class="mute">還沒有紀錄。服務結束後，在上面寫下這次的探索。</div>')+'</div>';
  h+='<div class="card"><h3>預約紀錄</h3>'+(bs.length?'<div class="scroll"><table><tr><th>日期</th><th>服務</th><th>狀態</th><th>金額</th><th>收款</th></tr>'+bs.map(function(b){
    return '<tr><td>'+nice(b.date)+' '+b.time+'</td><td>'+esc(b.service_name)+'</td><td><span class="pill s-'+b.status+'">'+b.status+'</span></td><td>'+money(b.price)+'</td><td>'+(b.paid==='已收款'?esc(b.method||'已收款'):'未收款')+'</td></tr>';
  }).join('')+'</table></div>':'<div class="mute">沒有預約紀錄。</div>')+'</div>';
  return h;
}
async function loadCusts(){ ui.custs = await api('adminCustomers',{ q:ui.cq }); }
async function loadCust(id){ ui.cust = await api('adminCustomer',{ customerId:id }); }

/* ---------- 動作 ---------- */
var val=function(id){ var el=$(id); return el?el.value.trim():''; };
var ACT={
  pick:function(d){ ui.svc=d.id; ui.step=2; ui.slot=null; ui.date=null; },
  date:function(d){ ui.date=d.d; ui.slot=null; },
  slot:function(d){ ui.slot=d.id; },
  toform:function(){ ui.step=3; },
  back2:function(){ ui.step=2; },
  home:async function(){ ui.step=1; ui.svc=ui.slot=ui.date=null; await loadC(); },
  book:async function(){
    if(D.isFriend===false) throw new Error('請先加入官方帳號好友');
    if(!$('f-agree').checked) throw new Error('請先勾選同意資料使用說明');
    try{
      ui.doneName=val('f-name');
      ui.done=await api('book',{ serviceId:ui.svc, slotId:ui.slot, name:val('f-name'), contact:val('f-contact'), topic:val('f-topic'), agree:true });
      ui.step=4;
    }catch(e){ await loadC(); ui.step=2; ui.slot=null; throw e; }
  },
  sendBack:function(){
    var d=ui.done;
    var text='我已完成預約\n姓名：'+(ui.doneName||D.name||'')+'\n服務：'+d.service+'\n時間：'+nice(d.date)+' '+d.time+'\n費用：NT$ '+d.price;
    var url=OA_MSG_URL+encodeURIComponent(text);
    try{ liff.openWindow({ url:url, external:false }); }catch(e){ location.href=url; }
  },
  addFriend:function(){
    try{ liff.openWindow({ url:OA_ADD_URL, external:false }); }catch(e){ location.href = OA_ADD_URL; }
  },
  recheck:async function(){
    D.isFriend = await checkFriend();
    if(D.isFriend===false) throw new Error('還沒看到你加入好友，加好後再按一次');
    toast('已確認加入好友，可以送出預約了');
  },
  cancel:async function(d){ await api('cancel',{ bookingId:d.id }); await loadC(); toast('預約已取消'); },
  admin:async function(){
    if(ui.stale) throw new Error('還在載入，請稍候一下再點');
    if(D.isAdmin){ await loadA(); ui.view='a'; }
    else if(D.adminUnset){ ui.showId=true; }
    else throw new Error('這是管理者專用的入口');
  },
  cview:async function(){ ui.view='c'; ui.step=1; await loadC(); },
  tab:async function(d){ ui.tab=d.t; if(d.t==='cust'){ ui.cust=null; ui.editRec=null; ui.prefill=null; await loadCusts(); } },
  custSearch:async function(){ ui.cq=val('c-q'); await loadCusts(); },
  custBack:async function(){ ui.cust=null; ui.editRec=null; ui.prefill=null; await loadCusts(); },
  openCust:async function(d){
    ui.tab='cust'; ui.editRec=null; ui.prefill=null;
    await loadCust(d.id);
    if(d.bid){
      var b=ui.cust.bookings.filter(function(x){return x.id===d.bid;})[0];
      if(b && !ui.cust.records.some(function(r){return r.booking_id===b.id;})) ui.prefill={ date:b.date, service:b.service_name, question:b.topic||'', bookingId:b.id };
    }
    window.scrollTo(0,0);
  },
  newCust:async function(){
    var r=await api('adminSaveCustomer',{ customer:{ name:val('nc-name'), contact:val('nc-contact') } });
    await loadCust(r.id); toast('已新增客人');
  },
  saveCust:async function(){
    await api('adminSaveCustomer',{ customer:{ id:ui.cust.customer.id, name:val('cu-name'), contact:val('cu-contact') } });
    await loadCust(ui.cust.customer.id); toast('資料已儲存');
  },
  delCust:async function(){
    if(!window.confirm('確定要刪除「'+ui.cust.customer.name+'」的資料和所有探索紀錄嗎？刪除後無法復原。')) return;
    await api('adminDeleteCustomer',{ customerId:ui.cust.customer.id });
    ui.cust=null; await loadCusts(); toast('已刪除');
  },
  saveRec:async function(){
    var base=ui.editRec||ui.prefill||{};
    await api('adminSaveRecord',{ record:{ id:base.id||'', bookingId:base.bookingId||base.booking_id||'', customerId:ui.cust.customer.id, date:val('r-date'), service:val('r-service'), topic:val('r-topic'), question:val('r-question'), cards:val('r-cards'), reading:val('r-reading'), memo:val('r-memo') } });
    ui.editRec=null; ui.prefill=null; await loadCust(ui.cust.customer.id); toast('紀錄已儲存');
  },
  editRec:function(d){ ui.editRec=ui.cust.records.filter(function(r){return r.id===d.id;})[0]||null; ui.prefill=null; window.scrollTo(0,0); },
  cancelRec:function(){ ui.editRec=null; ui.prefill=null; },
  delRec:async function(d){
    if(!window.confirm('確定要刪除這筆紀錄嗎？')) return;
    await api('adminDeleteRecord',{ recordId:d.id }); await loadCust(ui.cust.customer.id);
  },
  addSlots:async function(){
    var times=val('sl-times').replace(/，/g,',').replace(/：/g,':').split(',').map(function(t){ t=t.trim(); return /^\d:\d\d$/.test(t)?'0'+t:t; }).filter(Boolean);
    var r=await api('adminAddSlots',{ date:val('sl-date'), times:times }); await loadA(); toast('已加入 '+r.added+' 個時段');
  },
  delSlot:async function(d){ await api('adminRemoveSlot',{ slotId:d.id }); await loadA(); },
  saveSvc:async function(d){
    var id=d.id, g=function(f){ return val('sv-'+id+'-'+f); };
    await api('adminSaveService',{ service:{ id:id==='new'?'':id, name:g('name'), intro:g('intro'), price:g('price'), minutes:g('minutes'), mode:g('mode'), note:g('note'), active:$('sv-'+id+'-active').checked, tiered:$('sv-'+id+'-tiered').checked } });
    await loadA(); toast('服務已儲存');
  },
  saveSet:async function(){ await api('adminSaveSettings',{ settings:{ '預約頁說明':val('st-notice'), '收款說明':val('st-pay'), '取消期限小時':val('st-cancel') } }); await loadA(); toast('設定已儲存'); }
};
var CHG={
  status:async function(d,v){ await api('adminSetBooking',{ bookingId:d.id, status:v }); await loadA(); },
  paid:async function(d,v){ await api('adminSetBooking',{ bookingId:d.id, paid:v==='未收款'?'未收款':'已收款', method:v==='未收款'?'':v }); await loadA(); }
};
document.addEventListener('click',function(e){ var el=e.target.closest('[data-act]'); if(!el||el.disabled) return; run(function(){ return ACT[el.dataset.act](el.dataset); }); });
document.addEventListener('keydown',function(e){ if(e.key==='Enter' && e.target.id==='c-q'){ e.preventDefault(); run(function(){ return ACT.custSearch(); }); } });
document.addEventListener('change',function(e){ var el=e.target.closest('[data-chg]'); if(!el) return; run(function(){ return CHG[el.dataset.chg](el.dataset, el.value); }); });

function render(){
  $('brand').textContent=BRAND;
  if(!D) return;
  $('hello').textContent=ui.view==='a'?'管理後台':'';
  $('app').innerHTML = ui.view==='a'&&A ? vAdmin() : vCustomer();
}

(async function start(){
  $('brand').textContent=BRAND;
  // 先用上次存下的服務和時段把畫面畫出來，同時在背景向後端拿最新資料
  try{
    var c = JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c && c.services){ D = Object.assign({ mine:[], name:'', isAdmin:false, adminUnset:false, userId:'' }, c); ui.stale = true; render(); }
  }catch(e){}
  try{
    READY = liff.init({ liffId:LIFF_ID });
    await READY;
    if(!liff.isLoggedIn()){ liff.login({ redirectUri:location.href }); return; }
    var t1 = Date.now();
    await loadC();
    TIMES = { line:((t1-T0)/1000).toFixed(1), data:((Date.now()-t1)/1000).toFixed(1) };
    render();
  }catch(e){
    if(String(e && e.message).indexOf('登入') >= 0 && !recentlyRelogged()){ relogin(); return; }
    $('app').innerHTML='<div class="wrap"><div class="card">頁面載入失敗：'+esc(e&&e.message?e.message:e)+'<div class="mute">請關閉後重新打開。如果一直出現，請把這段訊息傳給 Mei。</div></div></div>';
  }
})();
</script>
